name: my_mpt
description: "An application for MPT students that allows you to view the class schedule."
publish_to: 'none'
version: 2.2.1+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  html: ^0.15.7
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^10.2.2
  flutter_rustore_update: ^10.5.4
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  cloud_firestore: ^7.1.0
  native_glass_navbar: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - docs/icons/icon.png
