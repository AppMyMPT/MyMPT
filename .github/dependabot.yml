version: 2
updates:
  # Dart & Flutter dependencies (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "dart"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Android & Gradle dependencies (android/build.gradle.kts)
  - package-ecosystem: "gradle"
    directory: "/android"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "android"
    commit-message:
      prefix: "chore(deps-android)"
    # Flutter 3.47 supports AGP <= 9.2 and Gradle <= 9.3.1.
    # Keep major/minor bumps of the build toolchain manual.
    ignore:
      - dependency-name: "com.android.application"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "gradle-wrapper"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "org.jetbrains.kotlin.android"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions workflows (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Moscow"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps-actions)"

